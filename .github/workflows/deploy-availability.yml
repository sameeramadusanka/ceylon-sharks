name: Deploy availability backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'infrastructure/**'
      - '.github/workflows/deploy-availability.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: availability-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Test
        working-directory: backend
        run: npm test

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::037207781401:role/ceylon-sharks-availability-deploy
          aws-region: ap-southeast-1

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Install esbuild for SAM's esbuild builder
        # SAM's NodejsNpmEsbuildBuilder runs its own staged install for each
        # function that omits devDependencies, so backend's own esbuild
        # devDependency isn't visible to it - it needs esbuild on PATH.
        run: npm install -g esbuild

      - name: SAM build
        working-directory: infrastructure
        run: sam build

      - name: SAM deploy
        working-directory: infrastructure
        run: |
          # --config-env ci selects the [ci.deploy.parameters] block in
          # samconfig.toml, which uses an explicit s3_bucket instead of
          # resolve_s3=true (see the comment there for why: this deploy
          # role has no CloudFormation permissions on the separate
          # "aws-sam-cli-managed-default" bootstrap stack that resolve_s3
          # would also try to touch, and SAM CLI refuses to mix resolve_s3
          # from config with an explicit --s3-bucket flag anyway).
          sam deploy --config-env ci --no-confirm-changeset --no-fail-on-empty-changeset \
            --parameter-overrides \
              SesFromEmail="${{ secrets.AVAILABILITY_SES_FROM_EMAIL }}" \
              CaptainEmail="${{ secrets.AVAILABILITY_CAPTAIN_EMAIL }}" \
              ViceCaptainEmail="${{ secrets.AVAILABILITY_VICE_CAPTAIN_EMAIL }}"

      - name: Health check
        run: |
          API_URL=$(aws cloudformation describe-stacks --region ap-southeast-1 \
            --stack-name ceylon-sharks-availability \
            --query 'Stacks[0].Outputs[?OutputKey==`AvailabilityApiUrl`].OutputValue' --output text)
          curl -sf "${API_URL}/availability/health" | tee /dev/stderr | grep -q '"status":"ok"'
