AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Ceylon Sharks match-availability backend (independent of the GitHub Pages
  frontend). Phase 1 foundation: DynamoDB tables, HTTP API, Lambda functions
  (health + stubs), EventBridge-scheduled coordinator, least-privilege IAM.
  Business logic for validate/submit/coordinator lands in later phases.

Parameters:
  GithubMatchDataBaseUrl:
    Type: String
    Description: Public raw-GitHub base URL the coordinator fetches published match JSON from.
    Default: https://raw.githubusercontent.com/sameeramadusanka/ceylon-sharks/main

  AvailabilityFrontendUrl:
    Type: String
    Description: >-
      Origin of the static frontend; used for CORS and links in emails.
      Must be https://ceylonsharks.com (apex, no www) - the site redirects
      www.ceylonsharks.com to the apex domain, so that's the real origin
      the browser uses when calling this API, confirmed by curl and by
      src/data/site.json's own canonicalUrl.
    Default: https://ceylonsharks.com

  TimeZone:
    Type: String
    Description: IANA timezone used for all calendar-day scheduling decisions.
    Default: Asia/Singapore

  InvitationDaysBefore:
    Type: Number
    Default: 5

  ReminderDaysBefore:
    Type: Number
    Default: 3

  ClosureDaysBefore:
    Type: Number
    Default: 2

  ClosureLocalTime:
    Type: String
    Description: Local time (HH:MM, TimeZone) at which availability closes on the closure day.
    Default: '23:59'

  SesFromEmail:
    Type: String
    Description: Verified SES sender identity. Not defaulted so a real address is never committed to this public repo.
    NoEcho: true

  CaptainEmail:
    Type: String
    Description: Captain's notification email address. Not defaulted; supply at deploy time.
    NoEcho: true

  ViceCaptainEmail:
    Type: String
    Description: Vice-captain's notification email address. Not defaulted; supply at deploy time.
    NoEcho: true

  TeamSelectionCaptainEmail:
    Type: String
    Description: >-
      Email allowed to select the match-day squad. Left empty, the feature
      stays disabled for everyone. Set to a test address first; switch to the
      real captain's email once verified.
    Default: ''
    NoEcho: true

  TeamSelectionTestRecipientEmail:
    Type: String
    Description: >-
      When set, squad-selection emails are redirected here instead of the
      real player - for testing before going live. Leave empty in production.
    Default: ''
    NoEcho: true

  PlayerOfTheWeekOwnerEmail:
    Type: String
    Description: >-
      Site owner's email. With CaptainEmail and ViceCaptainEmail, the only
      admins allowed to publish Player of the Week. Not defaulted so a real
      address is never committed; "none" disables it.
    Default: 'none'
    NoEcho: true

  PlayerOfTheWeekPublishBranch:
    Type: String
    Description: >-
      Branch the Player of the Week publish commits to. A test branch
      (created from main if missing) until the flow is verified, then main.
    Default: potw-test

  GithubRepo:
    Type: String
    Description: owner/name of the site repository the publish function commits to.
    Default: sameeramadusanka/ceylon-sharks

  GithubTokenParameterName:
    Type: String
    Description: >-
      SSM Parameter Store SecureString (name without the leading slash) holding
      the fine-grained GitHub token (this repo only, Contents read/write).
      Created by hand - never in this template or the repo.
    Default: ceylon-sharks/github-publish-token

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        TEAM_MEMBERS_TABLE: !Ref TeamMembersTable
        MATCH_AVAILABILITY_TABLE: !Ref MatchAvailabilityTable
        SCHEDULED_ACTIONS_TABLE: !Ref ScheduledActionsTable
        ADMIN_ALLOWLIST_TABLE: !Ref AdminAllowlistTable
        ADMIN_LOGIN_CODES_TABLE: !Ref AdminLoginCodesTable
        ADMIN_SESSIONS_TABLE: !Ref AdminSessionsTable
        GITHUB_MATCH_DATA_BASE_URL: !Ref GithubMatchDataBaseUrl
        AVAILABILITY_FRONTEND_URL: !Ref AvailabilityFrontendUrl
        SES_FROM_EMAIL: !Ref SesFromEmail
        CAPTAIN_EMAIL: !Ref CaptainEmail
        VICE_CAPTAIN_EMAIL: !Ref ViceCaptainEmail
        TEAM_SELECTION_CAPTAIN_EMAIL: !Ref TeamSelectionCaptainEmail
        TEAM_SELECTION_TEST_RECIPIENT_EMAIL: !Ref TeamSelectionTestRecipientEmail
        POTW_OWNER_EMAIL: !Ref PlayerOfTheWeekOwnerEmail
        TIME_ZONE: !Ref TimeZone
        INVITATION_DAYS_BEFORE: !Ref InvitationDaysBefore
        REMINDER_DAYS_BEFORE: !Ref ReminderDaysBefore
        CLOSURE_DAYS_BEFORE: !Ref ClosureDaysBefore
        CLOSURE_LOCAL_TIME: !Ref ClosureLocalTime

Resources:
  # ---------------------------------------------------------------------
  # DynamoDB
  # ---------------------------------------------------------------------
  TeamMembersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  MatchAvailabilityTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: matchId
          AttributeType: S
        - AttributeName: playerEmail
          AttributeType: S
        - AttributeName: tokenHash
          AttributeType: S
      KeySchema:
        - AttributeName: matchId
          KeyType: HASH
        - AttributeName: playerEmail
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: TokenLookupIndex
          KeySchema:
            - AttributeName: tokenHash
              KeyType: HASH
            - AttributeName: matchId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  ScheduledActionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: actionId
          AttributeType: S
      KeySchema:
        - AttributeName: actionId
          KeyType: HASH

  # Admin panel (read-only availability dashboard for captain/vice-captain/
  # trusted others) - see ceylon-sharks-admin-panel-idea.md. Deliberately
  # separate from TeamMembers: admin access isn't tied to being an active
  # player, so granting/revoking it can never affect invitation sending.
  AdminAllowlistTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  AdminLoginCodesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  AdminSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: sessionTokenHash
          AttributeType: S
      KeySchema:
        - AttributeName: sessionTokenHash
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # ---------------------------------------------------------------------
  # HTTP API
  # ---------------------------------------------------------------------
  AvailabilityHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref AvailabilityFrontendUrl
        AllowMethods: [GET, POST, PUT, OPTIONS]
        AllowHeaders: [content-type, authorization]

  # ---------------------------------------------------------------------
  # Log groups (created first so Lambda's default retention never applies)
  # ---------------------------------------------------------------------
  HealthLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-health
      RetentionInDays: 30

  ValidateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-validate
      RetentionInDays: 30

  SubmitLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-submit
      RetentionInDays: 30

  CoordinatorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-coordinator
      RetentionInDays: 30

  AdminLoginRequestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-admin-login-request
      RetentionInDays: 30

  AdminLoginVerifyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-admin-login-verify
      RetentionInDays: 30

  AdminMatchesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-admin-matches
      RetentionInDays: 30

  AdminMatchDetailLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-admin-match-detail
      RetentionInDays: 30

  SelectTeamLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-select-team
      RetentionInDays: 30

  PublishPlayerOfTheWeekLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-publish-potw
      RetentionInDays: 30

  NotifyPlayerOfTheWeekLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-notify-potw
      RetentionInDays: 30

  SitePhotosLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-site-photos
      RetentionInDays: 30

  NotifySitePhotosLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-notify-site-photos
      RetentionInDays: 30

  # ---------------------------------------------------------------------
  # Lambda functions
  # ---------------------------------------------------------------------
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-health
      CodeUri: ../backend
      Handler: src/handlers/health.handler
      LoggingConfig:
        LogGroup: !Ref HealthLogGroup
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AvailabilityHttpApi
            Path: /availability/health
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/health.ts]
        Target: es2022

  ValidateAvailabilityFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-validate
      CodeUri: ../backend
      Handler: src/handlers/validateAvailability.handler
      LoggingConfig:
        LogGroup: !Ref ValidateLogGroup
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MatchAvailabilityTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AvailabilityHttpApi
            Path: /availability/validate
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/validateAvailability.ts]
        Target: es2022

  SubmitAvailabilityFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-submit
      CodeUri: ../backend
      Handler: src/handlers/submitAvailability.handler
      LoggingConfig:
        LogGroup: !Ref SubmitLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MatchAvailabilityTable
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: '*'
              Condition:
                StringEquals:
                  ses:FromAddress: !Ref SesFromEmail
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AvailabilityHttpApi
            Path: /availability/submit
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/submitAvailability.ts]
        Target: es2022

  CoordinatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-coordinator
      CodeUri: ../backend
      Handler: src/handlers/coordinator.handler
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref CoordinatorLogGroup
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TeamMembersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MatchAvailabilityTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ScheduledActionsTable
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: '*'
              Condition:
                StringEquals:
                  ses:FromAddress: !Ref SesFromEmail
      Events:
        DailySchedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 8 * * ? *)
            ScheduleExpressionTimezone: !Ref TimeZone
            FlexibleTimeWindow:
              Mode: 'OFF'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/coordinator.ts]
        Target: es2022

  AdminLoginRequestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-admin-login-request
      CodeUri: ../backend
      Handler: src/handlers/requestAdminLogin.handler
      LoggingConfig:
        LogGroup: !Ref AdminLoginRequestLogGroup
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AdminAllowlistTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AdminLoginCodesTable
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: '*'
              Condition:
                StringEquals:
                  ses:FromAddress: !Ref SesFromEmail
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AvailabilityHttpApi
            Path: /admin/login/request
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/requestAdminLogin.ts]
        Target: es2022

  AdminLoginVerifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-admin-login-verify
      CodeUri: ../backend
      Handler: src/handlers/verifyAdminLogin.handler
      LoggingConfig:
        LogGroup: !Ref AdminLoginVerifyLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AdminLoginCodesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AdminSessionsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AvailabilityHttpApi
            Path: /admin/login/verify
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/verifyAdminLogin.ts]
        Target: es2022

  AdminMatchesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-admin-matches
      CodeUri: ../backend
      Handler: src/handlers/adminMatches.handler
      LoggingConfig:
        LogGroup: !Ref AdminMatchesLogGroup
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AdminSessionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref MatchAvailabilityTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AvailabilityHttpApi
            Path: /admin/matches
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/adminMatches.ts]
        Target: es2022

  AdminMatchDetailFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-admin-match-detail
      CodeUri: ../backend
      Handler: src/handlers/adminMatchDetail.handler
      LoggingConfig:
        LogGroup: !Ref AdminMatchDetailLogGroup
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AdminSessionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref MatchAvailabilityTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AvailabilityHttpApi
            Path: /admin/matches/{matchId}
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/adminMatchDetail.ts]
        Target: es2022

  SelectTeamFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-select-team
      CodeUri: ../backend
      Handler: src/handlers/selectTeam.handler
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref SelectTeamLogGroup
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AdminSessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MatchAvailabilityTable
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: '*'
              Condition:
                StringEquals:
                  ses:FromAddress: !Ref SesFromEmail
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AvailabilityHttpApi
            Path: /admin/matches/{matchId}/selection
            Method: PUT
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/selectTeam.ts]
        Target: es2022

  # Commits a Player of the Week poster + details to the site repo; the
  # site's own GitHub Pages workflow then deploys it. Only the captain,
  # vice-captain and site owner may call it (checked in the handler).
  PublishPlayerOfTheWeekFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-publish-potw
      CodeUri: ../backend
      Handler: src/handlers/publishPlayerOfTheWeek.handler
      Timeout: 30
      MemorySize: 512
      LoggingConfig:
        LogGroup: !Ref PublishPlayerOfTheWeekLogGroup
      Environment:
        Variables:
          GITHUB_REPO: !Ref GithubRepo
          POTW_PUBLISH_BRANCH: !Ref PlayerOfTheWeekPublishBranch
          POTW_BASE_BRANCH: main
          GITHUB_TOKEN_PARAMETER: !Sub /${GithubTokenParameterName}
          NOTIFY_POTW_FUNCTION: !Ref NotifyPlayerOfTheWeekFunction
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AdminSessionsTable
        - SSMParameterReadPolicy:
            ParameterName: !Ref GithubTokenParameterName
        - LambdaInvokePolicy:
            FunctionName: !Ref NotifyPlayerOfTheWeekFunction
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AvailabilityHttpApi
            Path: /admin/player-of-the-week
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/publishPlayerOfTheWeek.ts]
        Target: es2022

  # Started (asynchronously) by the publish function. Waits for the new
  # share page to go live, then emails the winner and the publishers.
  NotifyPlayerOfTheWeekFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-notify-potw
      CodeUri: ../backend
      Handler: src/handlers/notifyPlayerOfTheWeek.handler
      # Polls the site for up to ~12 minutes while GitHub Pages deploys.
      Timeout: 900
      LoggingConfig:
        LogGroup: !Ref NotifyPlayerOfTheWeekLogGroup
      # No automatic retries: a retry after a partial run would email people twice.
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TeamMembersTable
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: '*'
              Condition:
                StringEquals:
                  ses:FromAddress: !Ref SesFromEmail
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/notifyPlayerOfTheWeek.ts]
        Target: es2022

  # Admin "Site photos" tab: lists, uploads and publishes banner, Our Story
  # and player photos by committing to the site repo (same token and branch
  # as Player of the Week). Captain, vice-captain and site owner only.
  SitePhotosFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-site-photos
      CodeUri: ../backend
      Handler: src/handlers/sitePhotos.handler
      Timeout: 30
      MemorySize: 512
      LoggingConfig:
        LogGroup: !Ref SitePhotosLogGroup
      Environment:
        Variables:
          GITHUB_REPO: !Ref GithubRepo
          POTW_PUBLISH_BRANCH: !Ref PlayerOfTheWeekPublishBranch
          POTW_BASE_BRANCH: main
          GITHUB_TOKEN_PARAMETER: !Sub /${GithubTokenParameterName}
          NOTIFY_SITE_PHOTOS_FUNCTION: !Ref NotifySitePhotosFunction
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AdminSessionsTable
        - SSMParameterReadPolicy:
            ParameterName: !Ref GithubTokenParameterName
        - LambdaInvokePolicy:
            FunctionName: !Ref NotifySitePhotosFunction
      Events:
        List:
          Type: HttpApi
          Properties:
            ApiId: !Ref AvailabilityHttpApi
            Path: /admin/site-photos
            Method: GET
        Publish:
          Type: HttpApi
          Properties:
            ApiId: !Ref AvailabilityHttpApi
            Path: /admin/site-photos
            Method: POST
        Upload:
          Type: HttpApi
          Properties:
            ApiId: !Ref AvailabilityHttpApi
            Path: /admin/site-photos/upload
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/sitePhotos.ts]
        Target: es2022

  # Started (asynchronously) by SitePhotosFunction. Waits until the live site
  # was built from the new commit, then emails the publishers.
  NotifySitePhotosFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-notify-site-photos
      CodeUri: ../backend
      Handler: src/handlers/notifySitePhotos.handler
      # Polls the site for up to ~12 minutes while GitHub Pages deploys.
      Timeout: 900
      LoggingConfig:
        LogGroup: !Ref NotifySitePhotosLogGroup
      # No automatic retries: a retry would email people twice.
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Environment:
        Variables:
          GITHUB_REPO: !Ref GithubRepo
          POTW_PUBLISH_BRANCH: !Ref PlayerOfTheWeekPublishBranch
          GITHUB_TOKEN_PARAMETER: !Sub /${GithubTokenParameterName}
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Ref GithubTokenParameterName
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: '*'
              Condition:
                StringEquals:
                  ses:FromAddress: !Ref SesFromEmail
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/notifySitePhotos.ts]
        Target: es2022

Outputs:
  AvailabilityApiUrl:
    Description: Base URL for the availability HTTP API. Feed into the frontend's PUBLIC_AVAILABILITY_API_BASE_URL.
    Value: !Sub https://${AvailabilityHttpApi}.execute-api.${AWS::Region}.amazonaws.com

  TeamMembersTableName:
    Value: !Ref TeamMembersTable

  MatchAvailabilityTableName:
    Value: !Ref MatchAvailabilityTable

  ScheduledActionsTableName:
    Value: !Ref ScheduledActionsTable

  AdminAllowlistTableName:
    Value: !Ref AdminAllowlistTable

  AdminLoginCodesTableName:
    Value: !Ref AdminLoginCodesTable

  AdminSessionsTableName:
    Value: !Ref AdminSessionsTable
